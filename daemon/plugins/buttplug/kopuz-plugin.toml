id = "buttplug"
name = "Buttplug.io"
version = "0.1.0"
api = "0.2"
description = "Drives devices through Intiface Central, following the loudness, the bass or the beat of the music."

[permissions]
network = ["$server"]

[integration]
server = "url"
panel = true
listens = ["playback", "audio"]

[[integration.field]]
key = "url"
label = "Address"
kind = "url"
placeholder = "ws://127.0.0.1:12345"
help = "The server address shown in Intiface Central. Start its server first."
required = true
